# Palette default: default | dark (not Jekyll gem `theme`; see docs/theme-architecture.md)
site_theme: default
url     : https://wenxin195.github.io
baseurl :
Encoding: utf-8
title   : StatSphere
future  : true
description: >-
  模型与世界

lang    : zh-CN
locale  : zh-CN
timezone: Asia/Shanghai

author:
  name: Wenxin Zhong

license: CC-BY-NC-SA-4.0


excerpt_separator: <!--more-->
excerpt_type: html # text | html

toc:
  selectors: h1,h2,h3

LSI: false
Feature: true

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: apos,apos,quot,quot
  math_engine: mathjax
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

highlighter: rouge
permalink: date

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - playwright.config.js
  - e2e
  - playwright-report
  - test-results
  - test
  - Rakefile
  - scripts
  - TESTING.md
  - AGENTS.md
  - .npmrc
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      aside:
        toc: true
      lang: zh-CN
      locale: zh-CN
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "zh"
    values:
      lang: zh-CN
  - scope:
      path: "en"
    values:
      lang: en

sass:
  style: compressed
  sass_dir: _sass

feed:
  path: /zh/feed.xml
  excerpt_only: true
  post_limit: 999

pagination:
  enabled: true
  per_page: 8
  permalink: '/page/:num/'
  title: ':title'
  sort_field: 'date'
  sort_reverse: true
  trail:
    before: 2
    after: 2

autopages:
  enabled: false

plugins:
  - jekyll-redirect-from
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed


comments: false
pageview: false
analytics: false
search: default
