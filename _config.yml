# Palette default: default | dark (not Jekyll gem `theme`; see docs/theme-architecture.md)
site_theme: default
url     : https://wenxin195.github.io
baseurl :
Encoding: utf-8
title   : StatSphere
future  : true
description: >-
  走进数据世界，领略数学风采

lang    : zh-CN
locale  : zh-CN
timezone: Asia/Shanghai

author:
  name: Wenxin Zhong

license: CC-BY-NC-SA-4.0


excerpt_separator: <!--more-->
excerpt_type: html # text | html

toc:
  selectors: h1,h2,h3

paginate: 8
paginate_path: /page:num
LSI: false
Feature: true

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

highlighter: rouge
permalink: date

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      aside:
        toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

sass:
  style: compressed
  sass_dir: _sass

feed:
  path: /feed.xml
  excerpt_only: false
  post_limit: 999

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed


comments: false
pageview: false
analytics: false
search: default
