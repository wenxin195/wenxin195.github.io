<div class="multimedia">
  {%- if page.download -%}
    <div class="multimedia__pdf">
      <a href="https://www.alipan.com/s/ZsWqn6uAr91" target="_blank" title="下载 PDF">
        <img class="multimedia__icon" src="{{ '/assets/images/icon/lucide/download.svg' | relative_url }}" alt="" width="32" height="32" />
        <span>{{- _t.DOWNLOAD -}}</span>
      </a>
    </div>
  {%- endif -%}

  {%- if page.videos -%}
    <div class="multimedia__video">
      <a href="https://space.bilibili.com/10738871" target="_blank" title="观看视频">
        <img class="multimedia__icon" src="{{ '/assets/images/icon/lucide/video.svg' | relative_url }}" alt="" width="32" height="32" />
        <span>{{- _t.VIDEO -}}</span>
      </a>
    </div>
  {%- endif -%}
</div>
