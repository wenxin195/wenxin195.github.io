{%- comment -%} Google Analytics — public tracking ID from M5 integrations {%- endcomment -%}
{%- if site.data.integrations.analytics.google.tracking_id -%}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script src="https://www.googletagmanager.com/gtag/js?id={{ site.data.integrations.analytics.google.tracking_id }}" async></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.data.integrations.analytics.google.tracking_id }}');

    {% if site.data.integrations.analytics.google.anonymize_ip == true %}
    	gtag('config', '{{ site.data.integrations.analytics.google.tracking_id }}', { 'anonymize_ip': true });
    {% endif %}
  </script>
{%- endif -%}
