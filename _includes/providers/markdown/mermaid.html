{%- assign _sources = site.data.resources.sources -%}

<script
  type="module"
  src="{{ 'assets/scripts/entries/mermaid.js' | relative_url }}"
  data-mermaid-src="{{ _sources.mermaid }}"
></script>

<div
  class="modal mermaid-zoom-modal d-print-none js-mermaid-zoom-modal"
  aria-label="{{ _t.CHART_ZOOM }}"
>
  <button
    type="button"
    class="button button--secondary button--circle mermaid-zoom-modal__close js-mermaid-zoom-close"
    aria-label="{{ _t.CLOSE }}"
  >
    {% include utils/icon.html name="x" %}
  </button>
  <div class="swiper swiper--lightbox-controls mermaid-zoom-modal__stage js-mermaid-zoom-stage">
    <div class="swiper__wrapper js-mermaid-zoom-wrapper"></div>
    <button type="button" class="swiper__button swiper__button--prev" aria-label="{{ _t.PREVIOUS }}">
      {% include utils/icon.html name="chevron-left" %}
    </button>
    <button type="button" class="swiper__button swiper__button--next" aria-label="{{ _t.NEXT }}">
      {% include utils/icon.html name="chevron-right" %}
    </button>
  </div>
  <div class="mermaid-zoom-modal__counter js-mermaid-zoom-counter" aria-live="polite"></div>
</div>
