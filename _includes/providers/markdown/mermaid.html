{%- assign _sources = site.data.resources.sources -%}

<script
  type="module"
  src="{{ 'assets/scripts/entries/mermaid.js' | relative_url }}"
  data-mermaid-src="{{ _sources.mermaid }}"
></script>

<div
  class="modal mermaid-zoom-modal d-print-none js-mermaid-zoom-modal"
  aria-label="{{ _t.CHART_ZOOM }}"
>
  <button
    type="button"
    class="button button--secondary button--circle mermaid-zoom-modal__close js-mermaid-zoom-close"
    aria-label="{{ _t.CLOSE }}"
  >
    {% include utils/icon.html name="x" %}
  </button>
  <div class="mermaid-zoom-modal__stage js-mermaid-zoom-stage"></div>
</div>
