---
layout: shell
title: 404
show_title: false
---
{%- include utils/locale.html -%}
<div class="layout-not-found">

  <div class="layout-not-found__inner">
    <div class="not-found__content">
      <div class="sign">
        <img src="{{ 'assets/images/icon/ui/dangerous.svg' | relative_url }}" alt="" />
        <h1>Oops!</h1>
      </div>

      <div class="not-found__tip">
        <p><strong>Error Code: 404</strong></p>
        <p>看起来您访问的内容不存在，请检查您输入的地址是否正确。</p>
        <p>您可以 <a href="{{ '/' | relative_url }}">返回首页</a> 或 <a href="{{ site.data.path.urls.archive | prepend: site.baseurl }}">查看文章列表</a>。</p>
      </div>
    </div>

    <div class="not-found__image">
      <img src="{{ 'assets/images/picture/404/404.jpg' | relative_url }}" alt="404" />
    </div>
  </div>
</div>

{{ content }}
